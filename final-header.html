<style>

/* ================= TOP MARQUEE ================= */
.top-marquee{
    background:#0A71B9;
    color:#fff;
    font-size:13px;
    padding:6px 0;
}

/* ================= TOP LINKS ================= */
.top-links-wrapper{
    width:100%;
    position:relative;
}

.top-links-right{
    width:39%;
    margin-left:49%;
    background:#0A71B9;
    padding:6px 60px 6px 15px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
}

.top-links-right a{
    color:#fff;
    font-size:12.5px;
    font-weight:500;
    text-decoration:none;
}

/* ================= ACTIONS ================= */
.top-actions{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    gap:12px;
}

/* ================= LANGUAGE ================= */
.dropdown{
    border:1px solid #000;
    border-top:none;
    width:94px;
    height:32px;
    border-radius:0 0 5px 5px;
}

.lang-dropdown button{
    background:none;
    border:none;
    font-size:12px;
    display:flex;
    align-items:center;
    gap:6px;
}

.lang-dropdown img{
    width:18px;
    height:12px;
}

/* ================= TOGGLE ================= */
.switch{
    width:44px;
    height:22px;
    position:relative;
}
.switch input{display:none;}

.slider{
    position:absolute;
    inset:0;
    background:#fff;
    border-radius:20px;
    cursor:pointer;
}
.slider:before{
    content:"";
    position:absolute;
    width:16px;
    height:16px;
    left:3px;
    top:3px;
    background:#0A71B9;
    border-radius:50%;
    transition:.3s;
}
.switch input:checked + .slider{
    background:#0A71B9;
}
.switch input:checked + .slider:before{
    transform:translateX(22px);
    background:#fff;
}

/* ================= LOGO ================= */
.header-main{padding:15px 0;}
.logo img{height:55px;}
.search-box{
    width:260px;
    margin-left:auto;
    position:relative;
}
.search-box button{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
}

/* ================================================= */
/* ================= CODE-2 CSS ===================== */
/* ================================================= */

.kot-main-header-nav-bar{
    background:#0A71B9;
    position:relative;
    --hover-color:#8f4b36;
}

.kot-main-header-nav-bar-inner{
    display:flex;
    justify-content:center;
    align-items:center;
}

.kot-main-header-nav-bar-item-wrapper{
    display:flex;
    align-items:center;
    position:relative;
}

.kot-main-header-nav-bar-item-wrapper::before{
    content:"";
    position:absolute;
    inset:0;
    top:10%;
    background:var(--hover-color);
    opacity:0;
    z-index:0;
    transition:opacity .4s ease;
}

.kot-main-header-nav-bar-item-wrapper.hovered::before{
    opacity:1;
}

.kot-main-header-nav-bar-item{
    color:#fff;
    padding:14px 16px;
    font-weight:600;
    white-space:nowrap;
    position:relative;
    z-index:1;
    text-decoration:none;
    display:block;
}

.kot-main-header-nav-bar-item-wrapper:not(:last-child)::after{
    content:"";
    position:absolute;
    top:10%;
    right:0;
    width:1px;
    height:80%;
    background:#cfe6f7;
}

.kot-main-header-nav-bar-item-wrapper.hovered::after,
.kot-main-header-nav-bar-item-wrapper.previous-hide::after{
    opacity:0;
}

.kot-main-header-nav-bar-mega-menu{
    position:absolute;
    top:100%;
    left:0;
    width:100%;
    height:0;
    display:none;
    background:var(--hover-color);
    overflow:hidden;
    z-index:10;
    transition:height .4s ease;
}

.kot-main-header-nav-bar-mega-menu.show{
    height:320px;
}

.kot-main-header-nav-bar-mega-content{
    max-width:1140px;
    margin:auto;
    padding:30px;
    color:#fff;
    opacity:0;
    transform:translateY(-15px);
    transition:.3s;
}

.kot-main-header-nav-bar-mega-menu.show 
.kot-main-header-nav-bar-mega-content{
    opacity:1;
    transform:translateY(0);
}

.kot-main-header-nav-bar-mega-grid{
    display:grid;
    grid-template-columns:1.3fr 1fr 2fr;
    gap:30px;
}

.kot-main-header-nav-bar-list-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.kot-main-header-nav-bar-list-col ul{
    list-style:none;
    padding:0;
    margin:0;
}

.kot-main-header-nav-bar-list-col li{
    margin-bottom:10px;
}

.kot-main-header-nav-bar-list-col a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* ================= CODE-2 JS (EXACT) ================= */

const nav = document.getElementById("nav");
const megaMenu = document.getElementById("megaMenu");

const img = document.getElementById("mm-img");
const text = document.getElementById("mm-text");
const heading = document.getElementById("mm-heading");
const desc = document.getElementById("mm-desc");
const left = document.getElementById("mm-left");
const right = document.getElementById("mm-right");

const content = document.querySelector(".kot-main-header-nav-bar-mega-content");

let isMegaOpen = false;

const hoverColors = {
  CORPORATE:"#28a745",
  SERVICES:"#fd7e14",
  CONSULTANCY:"#0d6efd",
  MARKETPLACE:"#6610f2",
  SPOTLIGHTS:"#20c997",
  SUPPORT:"#ffc107",
  CAREER:"#dc3545",
  CONTACT:"#6c757d"
};

document.querySelectorAll(".kot-main-header-nav-bar-item")
.forEach((item,i,arr)=>{

  item.addEventListener("mouseenter",()=>{

    document.querySelectorAll(".kot-main-header-nav-bar-item-wrapper")
      .forEach(w=>w.classList.remove("hovered","previous-hide"));

    const wrap = item.parentElement;
    wrap.classList.add("hovered");
    if(i>0) arr[i-1].parentElement.classList.add("previous-hide");

    nav.style.setProperty(
      "--hover-color",
      hoverColors[item.innerText.trim()] || "#8f4b36"
    );

    content.style.transition = "none";
    content.style.opacity = "0";
    content.style.transform = "translateY(-20px)";

    requestAnimationFrame(()=>{

      content.style.transition = ".35s ease";

      img.src = item.dataset.img;
      text.innerText = item.dataset.text;
      heading.innerText = item.dataset.heading;
      desc.innerText = item.dataset.desc;

      left.innerHTML = item.dataset.left.split(",").map(v=>`<li><a href="#">📌 ${v}</a></li>`).join("");
      right.innerHTML = item.dataset.right.split(",").map(v=>`<li><a href="#">⭐ ${v}</a></li>`).join("");

      content.style.opacity = "1";
      content.style.transform = "translateY(0)";
    });

    if(!isMegaOpen){
      megaMenu.style.display = "block";
      requestAnimationFrame(()=>megaMenu.classList.add("show"));
      isMegaOpen = true;
    }
  });
});

nav.addEventListener("mouseleave",()=>{
  document.querySelectorAll(".kot-main-header-nav-bar-item-wrapper")
    .forEach(w=>w.classList.remove("hovered","previous-hide"));

  megaMenu.classList.remove("show");
  isMegaOpen = false;

  setTimeout(()=>megaMenu.style.display="none",300);
});
</script>
