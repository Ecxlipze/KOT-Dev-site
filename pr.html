<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KOT Enterprises Header</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FONT AWESOME -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>

/* ================= TOP MARQUEE ================= */
.top-marquee{
    background:#0A71B9;
    color:#fff;
    font-size:13px;
    padding:6px 0;
}

.top-marquee marquee{
    font-weight:500;
}

/* ================= MAIN HEADER ================= */
.main-header{
    background:#fff;
    display:flex;
    flex-direction:column;
}

/* ================= TOP LINKS ================= */
.header-top-links{
    background:#0A71B9;
    width:40%;
    padding:6px 15px;
    margin-left:auto;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:12px;
    flex-wrap:wrap;
}

.header-top-links a{
    font-family: Montserrat;
    font-size:12.55px;
    color:#fff;
    text-decoration:none;
    font-weight:500;
}

.header-top-links a:hover{
    text-decoration:underline;
}

.header-top-links img{
    width:12px;
    height:7px;
}

/* ================= DROPDOWN ================= */
.header-dropdown button{
    background:transparent;
    border:none;
    color:#fff;
    padding:0;
}

.header-dropdown .profile-img{
    width:18px;
    height:18px;
}

.header-dropdown .dropdown-menu{
    font-size:13px;
    min-width:140px;
}

/* ================= LOGO + SEARCH ================= */
.header-bottom{
    padding:15px 0;
}

.logo img{
    height:55px;
}

/* SEARCH */
.search-box{
    position:relative;
    width:260px;
}

.search-box input{
    border-radius:7px;
    padding-right:40px;
}

.search-box button{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
}

/* ================= NAV BAR ================= */
.nav-bar{
    background:#0A71B9;
}

.nav-bar a{
    color:#fff;
    padding:12px 18px;
    font-weight:600;
    text-decoration:none;
}

.nav-bar a:hover{
    background:#1565c0;
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
    .header-top-links{
        width:100%;
        justify-content:center;
    }

    .search-box{
        width:100%;
    }
}

</style>
</head>

<body>

<!-- ================= TOP MARQUEE ================= -->
<div class="top-marquee">
    <div class="container">
        <marquee behavior="scroll" direction="left">
            Empowering businesses to streamline operations, reduce inefficiencies, and achieve sustainable growth through tailored solutions.
        </marquee>
    </div>
</div>

<!-- ================= MAIN HEADER ================= -->
<div class="main-header">

    <!-- TOP LINKS -->
     <div class="header-top-links">
    <div class="header-top-links-main">

        <span><img src="assets/images/Header/Vector (1).png"></span>
        <a href="#">Home</a>

        <span><img src="assets/images/Header/Vector (1).png"></span>
        <a href="#">Startups</a>

        <span><img src="assets/images/Header/Vector (1).png"></span>
        <a href="#">E-Life</a>

        <span><img src="assets/images/Header/Vector (1).png"></span>
        <a href="#">FAQ</a>

        <span><img src="assets/images/Header/Vector (1).png"></span>
        <a href="#">Contact</a>

        <span><img src="assets/images/Header/Vector (1).png"></span>
        <a href="#">Site Map</a>

        

    </div>
    <!-- 🔽 DROPDOWN -->
        <div class="dropdown header-dropdown">
            <button class="dropdown-toggle d-flex align-items-center" data-bs-toggle="dropdown">
                <img src="assets/images/Header/user.png" class="profile-img me-1">
            </button>

            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#">ABC</a></li>
                <li><a class="dropdown-item" href="#">BFD</a></li>
                <li><a class="dropdown-item" href="#">DFR</a></li>
            </ul>
        </div>
    </div>
    <!-- LOGO + SEARCH -->
    <div class="header-bottom">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-md-4 col-12 mb-2 mb-md-0">
                    <div class="logo">
                        <img src="assets/images/Header/support-2.png" alt="KOT Enterprises">
                    </div>
                </div>

                <div class="col-md-8 col-12 text-md-end">
                    <div class="search-box ms-md-auto">
                        <input type="text" class="form-control" placeholder="Search">
                        <button>
                            <img src="assets/images/Header/search-icon.png">
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

<!-- ================= NAVIGATION ================= -->
<div class="nav-bar">
    <div class="container d-flex justify-content-center flex-wrap">
        <a href="#">CORPORATE</a>
        <a href="#">SERVICES</a>
        <a href="#">CONSULTANCY</a>
        <a href="#">SUPPORT</a>
        <a href="#">CAREER</a>
        <a href="#">CONTACT</a>
    </div>
</div>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
