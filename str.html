<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Sets AgileApps Apart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f7f7f7;
    font-family: Montserrat, sans-serif;
}

/* ================= TITLE ================= */
.section-title{
    font-size: 36px;
    font-weight: 800;
    color:#9b1aa9;
}

/* ================= BOX ================= */
.box{
    background:#333;
    color:#fff;
    padding:28px;
    border-radius:20px;
    font-size:18px;
    line-height:1.5;
    position:relative;
}

/* Number */
.num{
    background:#fff;
    color:#9b1aa9;
    font-weight:700;
    padding:6px 14px;
    border-radius:50px;
    display:inline-block;
    margin-bottom:15px;
}

/* ================= ARROWS ================= */
.arrow-img{
    position:absolute;
    width:180px;
    top:50%;
    transform:translateY(-50%);
    z-index:1;
}

/* Arrow Positions */
.arrow-right{
    right:-180px;
}

.arrow-left{
    left:-180px;
    transform:translateY(-50%) scaleX(-1);
}

/* ================= RESPONSIVE ================= */
@media(max-width:992px){
    .arrow-img{
        display:none;
    }
}
</style>
</head>

<body>

<div class="container py-5">

    <h2 class="text-center section-title mb-5">
        What Sets AgileApps Apart
    </h2>

    <div class="row justify-content-center gy-5">

        <!-- ROW 1 -->
        <div class="col-lg-5 position-relative">
            <div class="box">
                <span class="num">01</span>
                <p class="mb-0">
                    Expertise in SaaS and full-stack development
                </p>
            </div>

            <img src="assets/images/Agile/Vector 627.png"
                 class="arrow-img arrow-right d-none d-lg-block">
        </div>

        <!-- ROW 2 -->
        <div class="col-lg-5 position-relative mt-lg-5">
            <div class="box">
                <span class="num">02</span>
                <p class="mb-0">
                    Backed by KOT’s trusted technological infrastructure
                </p>
            </div>

            <img src="assets/images/Agile/Vector 628.png"
                 class="arrow-img arrow-left d-none d-lg-block">
        </div>

        <!-- ROW 3 -->
        <div class="col-lg-5 position-relative">
            <div class="box">
                <span class="num">03</span>
                <p class="mb-0">
                    Designed for high performance, scalability, and uptime
                </p>
            </div>

            <img src="assets/images/Agile/Vector 629.png"
                 class="arrow-img arrow-right d-none d-lg-block">
        </div>

        <!-- ROW 4 -->
        <div class="col-lg-5 mt-lg-5">
            <div class="box">
                <span class="num">04</span>
                <p class="mb-0">
                    Designed for high performance, scalability, and uptime
                </p>
            </div>
        </div>

    </div>
</div>

</body>
</html>
