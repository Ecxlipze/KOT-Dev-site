<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KOT Enterprises Mega Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
}

/* ================= NAV BAR ================= */
.kot-main-header-nav-bar{
    background:#0A71B9;
    position:relative;
    --hover-color:#8f4b36;
}

.kot-main-header-nav-bar-inner{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Wrapper */
.kot-main-header-nav-bar-item-wrapper{
    display:flex;
    align-items:center;
    position:relative;
}

/* Hover background */
.kot-main-header-nav-bar-item-wrapper::before{
    content:"";
    position:absolute;
    inset:0;
    top:10%;
    background:var(--hover-color);
    opacity:0;
    z-index:0;
    transition:opacity .4s ease;
}

.kot-main-header-nav-bar-item-wrapper.hovered::before{
    opacity:1;
}

/* Anchor */
.kot-main-header-nav-bar-item{
    color:#fff;
    padding:14px 16px;
    font-weight:600;
    white-space:nowrap;
    position:relative;
    z-index:1;
    text-decoration:none;
    display:block;
}

/* Borders */
.kot-main-header-nav-bar-item-wrapper:not(:last-child)::after{
    content:"";
    position:absolute;
    top:10%;
    right:0;
    width:1px;
    height:80%;
    background:#cfe6f7;
}

.kot-main-header-nav-bar-item-wrapper.hovered::after,
.kot-main-header-nav-bar-item-wrapper.previous-hide::after{
    opacity:0;
}

/* ================= MEGA MENU ================= */
.kot-main-header-nav-bar-mega-menu{
    position:absolute;
    top:100%;
    left:0;
    width:100%;
    height:0;
    display:none;
    background:var(--hover-color);
    overflow:hidden;
    z-index:10;
    transition:height .4s ease;
}

.kot-main-header-nav-bar-mega-menu.show{
    height:320px;
}

/* ================= CONTENT ================= */
.kot-main-header-nav-bar-mega-content{
    max-width:1140px;
    margin:auto;
    padding:30px;
    color:#fff;
    opacity:0;
    transform:translateY(-15px);
    transition:.3s;
}

.kot-main-header-nav-bar-mega-menu.show 
.kot-main-header-nav-bar-mega-content{
    opacity:1;
    transform:translateY(0);
}

.kot-main-header-nav-bar-mega-grid{
    display:grid;
    grid-template-columns:1.3fr 1fr 2fr;
    gap:30px;
}

.kot-main-header-nav-bar-col-1 img{
    width:100%;
    border-radius:6px;
    margin-bottom:12px;
}

.kot-main-header-nav-bar-col-1 p,
.kot-main-header-nav-bar-col-2 p{
    font-size:14px;
    line-height:1.6;
}

.kot-main-header-nav-bar-col-2 h3{
    margin-top:0;
}

.kot-main-header-nav-bar-mega-btn{
    display:inline-block;
    padding:10px 18px;
    background:#fff;
    color:#000;
    font-weight:600;
    border-radius:4px;
    text-decoration:none;
    margin-top:10px;
}

.kot-main-header-nav-bar-mega-btn.outline{
    background:transparent;
    border:2px solid #fff;
    color:#fff;
}

.kot-main-header-nav-bar-list-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.kot-main-header-nav-bar-list-col ul{
    list-style:none;
    padding:0;
    margin:0;
}

.kot-main-header-nav-bar-list-col li{
    margin-bottom:10px;
}

.kot-main-header-nav-bar-list-col a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="kot-main-header-nav-bar" id="nav">
  <div class="kot-main-header-nav-bar-inner">

    <!-- CORPORATE -->
    <div class="kot-main-header-nav-bar-item-wrapper">
      <a class="kot-main-header-nav-bar-item" href="#"
        data-img="https://via.placeholder.com/300x160?text=Corporate"
        data-text="Enterprise-grade digital solutions."
        data-heading="Corporate Solutions"
        data-desc="Robust systems for large organizations."
        data-left="ERP,CRM,HRMS,Intranet,Compliance"
        data-right="Strategy,Governance,Security,Audits,Support">
        CORPORATE
      </a>
    </div>

    <!-- SERVICES -->
    <div class="kot-main-header-nav-bar-item-wrapper">
      <a class="kot-main-header-nav-bar-item" href="#"
        data-img="https://via.placeholder.com/300x160?text=Services"
        data-text="Managed IT and digital services."
        data-heading="Our Services"
        data-desc="From development to deployment."
        data-left="Web Apps,Mobile Apps,Cloud,DevOps,UI UX"
        data-right="Maintenance,Monitoring,Scaling,Upgrades,Support">
        SERVICES
      </a>
    </div>

    <!-- CONSULTANCY -->
    <div class="kot-main-header-nav-bar-item-wrapper">
      <a class="kot-main-header-nav-bar-item" href="#"
        data-img="https://via.placeholder.com/300x160?text=Consultancy"
        data-text="Expert consulting services."
        data-heading="Consultancy"
        data-desc="Guiding digital transformation."
        data-left="IT Audit,Roadmap,Risk,Architecture,Planning"
        data-right="Optimization,Advisory,Security,Governance,QA">
        CONSULTANCY
      </a>
    </div>

    <!-- MARKETPLACE -->
    <div class="kot-main-header-nav-bar-item-wrapper">
      <a class="kot-main-header-nav-bar-item" href="#"
        data-img="https://via.placeholder.com/300x160?text=Marketplace"
        data-text="Technology marketplace solutions."
        data-heading="Marketplace"
        data-desc="Products that power business."
        data-left="POS,Plugins,Themes,Integrations,APIs"
        data-right="Licensing,Updates,Support,Addons,Docs">
        MARKETPLACE
      </a>
    </div>

    <!-- SPOTLIGHTS -->
    <div class="kot-main-header-nav-bar-item-wrapper">
      <a class="kot-main-header-nav-bar-item" href="#"
        data-img="https://via.placeholder.com/300x160?text=Spotlights"
        data-text="Featured projects and highlights."
        data-heading="Spotlights"
        data-desc="Showcasing innovation."
        data-left="Case Studies,Success Stories,Awards,Media,Events"
        data-right="Highlights,Press,News,Gallery,Timeline">
        SPOTLIGHTS
      </a>
    </div>

    <!-- SUPPORT -->
    <div class="kot-main-header-nav-bar-item-wrapper">
      <a class="kot-main-header-nav-bar-item" href="#"
        data-img="https://via.placeholder.com/300x160?text=Support"
        data-text="Dedicated customer support."
        data-heading="Support Center"
        data-desc="We are here to help."
        data-left="Help Desk,Documentation,FAQs,Tickets,Community"
        data-right="Live Chat,Email,SLA,Updates,Status">
        SUPPORT
      </a>
    </div>

    <!-- CAREER -->
    <div class="kot-main-header-nav-bar-item-wrapper">
      <a class="kot-main-header-nav-bar-item" href="#"
        data-img="https://via.placeholder.com/300x160?text=Career"
        data-text="Join our growing team."
        data-heading="Careers"
        data-desc="Build your future with us."
        data-left="Open Roles,Internships,Culture,Benefits,Life@KOT"
        data-right="Apply Now,HR Policies,Training,Growth,Events">
        CAREER
      </a>
    </div>

    <!-- CONTACT -->
    <div class="kot-main-header-nav-bar-item-wrapper">
      <a class="kot-main-header-nav-bar-item" href="#"
        data-img="https://via.placeholder.com/300x160?text=Contact"
        data-text="Get in touch with us."
        data-heading="Contact Us"
        data-desc="Let’s start a conversation."
        data-left="Email,Phone,Locations,Support,Enquiry"
        data-right="Request Quote,Meet Team,Office Map,Hours,Directions">
        CONTACT
      </a>
    </div>

  </div>

  <!-- MEGA MENU -->
  <div class="kot-main-header-nav-bar-mega-menu" id="megaMenu">
    <div class="kot-main-header-nav-bar-mega-content">
      <div class="kot-main-header-nav-bar-mega-grid">

        <div class="kot-main-header-nav-bar-col-1">
          <img id="mm-img">
          <p id="mm-text"></p>
          <a href="#" class="kot-main-header-nav-bar-mega-btn">Learn More</a>
        </div>

        <div class="kot-main-header-nav-bar-col-2">
          <h3 id="mm-heading"></h3>
          <p id="mm-desc"></p>
          <a href="#" class="kot-main-header-nav-bar-mega-btn outline">Get Started</a>
        </div>

        <div class="kot-main-header-nav-bar-col-3">
          <div class="kot-main-header-nav-bar-list-row">
            <div class="kot-main-header-nav-bar-list-col">
              <ul id="mm-left"></ul>
            </div>
            <div class="kot-main-header-nav-bar-list-col">
              <ul id="mm-right"></ul>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>

<script>
const nav = document.getElementById("nav");
const megaMenu = document.getElementById("megaMenu");

const img = document.getElementById("mm-img");
const text = document.getElementById("mm-text");
const heading = document.getElementById("mm-heading");
const desc = document.getElementById("mm-desc");
const left = document.getElementById("mm-left");
const right = document.getElementById("mm-right");

const content = document.querySelector(".kot-main-header-nav-bar-mega-content");

let isMegaOpen = false;

const hoverColors = {
  CORPORATE:"#28a745",
  SERVICES:"#fd7e14",
  CONSULTANCY:"#0d6efd",
  MARKETPLACE:"#6610f2",
  SPOTLIGHTS:"#20c997",
  SUPPORT:"#ffc107",
  CAREER:"#dc3545",
  CONTACT:"#6c757d"
};

document
.querySelectorAll(".kot-main-header-nav-bar-item")
.forEach((item,i,arr)=>{

  item.addEventListener("mouseenter",()=>{

    /* ===== NAV ITEM BG ===== */
    document
      .querySelectorAll(".kot-main-header-nav-bar-item-wrapper")
      .forEach(w=>w.classList.remove("hovered","previous-hide"));

    const wrap = item.parentElement;
    wrap.classList.add("hovered");
    if(i>0) arr[i-1].parentElement.classList.add("previous-hide");

    nav.style.setProperty(
      "--hover-color",
      hoverColors[item.innerText.trim()] || "#8f4b36"
    );

    /* ===== CONTENT SLIDE RESET (NO CLOSE) ===== */
    content.style.transition = "none";
    content.style.opacity = "0";
    content.style.transform = "translateY(-20px)";

    requestAnimationFrame(()=>{

      content.style.transition = ".35s ease";
      
      /* ===== UPDATE CONTENT ===== */
      img.src = item.dataset.img;
      text.innerText = item.dataset.text;
      heading.innerText = item.dataset.heading;
      desc.innerText = item.dataset.desc;

      left.innerHTML = item.dataset.left
        .split(",")
        .map(v=>`<li><a href="#">📌 ${v}</a></li>`)
        .join("");

      right.innerHTML = item.dataset.right
        .split(",")
        .map(v=>`<li><a href="#">⭐ ${v}</a></li>`)
        .join("");

      /* ===== SLIDE DOWN AGAIN ===== */
      content.style.opacity = "1";
      content.style.transform = "translateY(0)";
    });

    /* ===== OPEN ONLY FIRST TIME ===== */
    if(!isMegaOpen){
      megaMenu.style.display = "block";
      requestAnimationFrame(()=>{
        megaMenu.classList.add("show");
      });
      isMegaOpen = true;
    }
  });
});

/* ===== CLOSE ONLY ON LEAVE NAV ===== */
nav.addEventListener("mouseleave",()=>{
  document
    .querySelectorAll(".kot-main-header-nav-bar-item-wrapper")
    .forEach(w=>w.classList.remove("hovered","previous-hide"));

  megaMenu.classList.remove("show");
  isMegaOpen = false;

  setTimeout(()=>{
    megaMenu.style.display = "none";
  },300);
});
</script>


</body>
</html>
